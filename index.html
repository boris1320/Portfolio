<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boris Portfolio | O&O</title>
<link
href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Poppins:wght@300;400;500&display=swap"
rel="stylesheet">
<style>
:root {
--bg-color: #050a14;
--glass-bg: rgba(255, 255, 255, 0.03);
--glass-border: rgba(255, 255, 255, 0.1);
--glass-blur: 20px;
--accent-color: #38bdf8;
--text-main: #f1f5f9;
--text-muted: #94a3b8;
--font-title: 'Plus Jakarta Sans', sans-serif;
--font-body: 'Poppins', sans-serif;
--pdf-red: #ef4444;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
}

body {
font-family: var(--font-body);
background-color: var(--bg-color);
color: var(--text-main);
line-height: 1.6;
overflow-x: hidden;
min-height: 100vh;
}

/* Ambient Glows - Alleen Blauw */
body::before,
body::after {
content: '';
position: fixed;
width: 400px;
height: 400px;
border-radius: 50%;
filter: blur(120px);
z-index: -1;
opacity: 0.15;
}

body::before {
background-color: var(--accent-color);
top: 5%;
left: 5%;
}

body::after {
background-color: var(--accent-color);
bottom: 5%;
right: 5%;
}

.glass {
background: var(--glass-bg);
backdrop-filter: blur(var(--glass-blur));
-webkit-backdrop-filter: blur(var(--glass-blur));
border: 1px solid var(--glass-border);
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
}

/* Navigatie */
nav {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 75px;
z-index: 1000;
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 50px;
background: rgba(15, 23, 42, 0.1);
backdrop-filter: blur(25px) saturate(180%);
border-bottom: 1px solid var(--glass-border);
}
